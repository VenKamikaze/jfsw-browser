<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Warrior</title>
<link rel="stylesheet" href="jfsw.css">
</head>
<body>
<main id="stage">
  <canvas id="canvas" width="640" height="480" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="overlay" role="status">
    <h1>Shadow Warrior</h1>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status">Loading...</p>
    <p id="datainfo" hidden></p>
    <button id="start" type="button" hidden>Click to start</button>
    <button id="retry" type="button" hidden>Try again</button>
    <button id="reload" type="button" hidden>Reload the page</button>
    <div id="datactl" hidden>
      <label class="btn secondary" id="picklabel">Use your own copy of the game data...<input id="pick" type="file" accept=".grp,.GRP"></label>
      <button id="redownload" class="secondary" type="button" hidden>Download again</button>
      <button id="usedownload" class="secondary" type="button" hidden>Use the download instead</button>
    </div>
  </div>
</main>
<div id="lobby" role="dialog" aria-labelledby="lobbytitle" aria-describedby="lobbystate" hidden>
  <div class="box">
    <h2 id="lobbytitle">Network game</h2>
    <p id="lobbystate" role="status" aria-live="polite">Connecting to the relay...</p>
    <div id="lobbyroom" hidden>
      <p class="label">Room code</p>
      <p id="lobbycode" class="code"></p>
      <label class="label" for="lobbylink">Invite link: send it to the other players</label>
      <div class="linkrow"><input id="lobbylink" type="text" readonly><button id="lobbycopy" class="secondary" type="button">Copy</button></div>
      <p id="lobbyplayers" aria-live="polite"></p>
    </div>
    <div class="buttons">
      <button id="lobbystart" type="button" hidden disabled>Start now</button>
      <button id="lobbycancel" class="secondary" type="button">Cancel</button>
    </div>
  </div>
</div>
<p id="help" hidden>
  Keyboard and mouse as in the desktop game (the mouse is captured when you click the picture).
  <b>Escape</b> opens the menu; it also releases the mouse.
</p>
<pre id="testinfo" hidden></pre>

<script src="config.js"></script>
<script src="grptable.js"></script>
<script src="data.js"></script>
<script src="jfsw.js"></script>
<script async src="sw.js"></script>
</body>
</html>
